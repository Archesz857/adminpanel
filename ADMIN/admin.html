<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ARCHESZ ADMIN</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="../DESIGNEDCSS/style.css">
<link rel="stylesheet" href="../DESIGNEDCSS/admin.css">
<script src="../SCRIPTJS/script.js" defer></script>
<script src="../SCRIPTJS/admin.js" defer></script>
</head>
<body data-role="admin">
<div class="container">

  <!-- LOGIN GATE -->
  <div id="gate" class="panel-card">
    <div class="vip-badge"><span class="dot"></span> ARCHESZ ADMIN</div>
    <h2><i class="fas fa-lock"></i> Admin Login</h2>
    <div class="field-box"><i class="fas fa-key"></i><input id="pass" type="password" placeholder="Admin passcode"></div>
    <p class="warn-note" id="passErr" hidden>Wrong passcode.</p>
    <button class="btn btn-purple full-btn" id="loginBtn"><i class="fas fa-right-to-bracket"></i> Enter</button>
  </div>

  <!-- DASHBOARD -->
  <div id="app" hidden>
    <div class="hero-card">
      <div class="vip-badge"><span class="dot"></span> ARCHESZ ADMIN PANEL</div>
      <h1>Order <span class="text-green">Control</span></h1>
      <div class="stats-row">
        <div class="stat-item"><div class="stat-bar"></div><b id="stPend">0</b><p>Pending</p></div>
        <div class="stat-item"><div class="stat-bar"></div><b id="stDone">0</b><p>Approved</p></div>
        <div class="stat-item"><div class="stat-bar"></div><b id="stCoins">0</b><p>Funds Added</p></div>
        <div class="stat-item"><div class="stat-bar"></div><b id="stSales">0</b><p>Product Sales</p></div>
      </div>
    </div>

    <div class="filter-btns" id="tabs">
      <button class="filter-btn active" data-f="pending">Pending</button>
      <button class="filter-btn" data-f="approved">Approved</button>
      <button class="filter-btn" data-f="cancelled">Cancelled</button>
      <button class="filter-btn" data-f="sales">Product Sales</button>
      <button class="filter-btn" data-f="support"><i class="fas fa-headset"></i> Support <span class="badge" id="supBadge" hidden>0</span></button>
      <button class="filter-btn" data-f="feedback"><i class="fas fa-star"></i> Feedbacks</button>
      <button class="filter-btn" data-f="users"><i class="fas fa-users"></i> Users</button>
    </div>
    <div class="hist-list" id="list"></div>
    <div id="supportBox" hidden></div>
    <div id="usersBox" hidden>
      <div class="panel-card chat-panel">
        <h2><i class="fas fa-coins"></i> Add Funds</h2>
        <label class="field-label" for="addMail">GMAIL ACCOUNTS</label>
        <div class="field-box"><i class="fas fa-envelope"></i><input id="addMail" list="mailList" type="email" placeholder="USERGMAIL@gmail.com" autocomplete="off"><datalist id="mailList"></datalist></div>
        <label class="field-label" for="addCoins">AMOUNT (₱)</label>
        <div class="input-points"><input id="addCoins" type="number" min="1" placeholder="0"><span>₱</span></div>
        <button class="btn btn-purple full-btn" id="addBtn"><i class="fas fa-plus"></i> Add Funds</button>
      </div>
      <div class="panel-card chat-panel" style="margin-top:16px">
        <h2><i class="fas fa-image"></i> Product Image (ARCHESZ v1.57)</h2>
        <div class="sale-head" style="margin-bottom:12px"><div id="prodPrev"></div><small class="small-note">Your own picture. Shown in Shop, Done Buy and here.</small></div>
        <div class="act-row"><button class="btn btn-cancel" id="prodDel"><i class="fas fa-trash"></i> Remove</button><button class="btn btn-ok" id="prodUp"><i class="fas fa-upload"></i> Upload picture</button></div>
      </div>
      <h3 style="margin:22px 0 10px">REGISTERED USERS <span class="plus" id="uCount" style="color:#ffcc46"></span></h3>
      <div class="hist-list" id="userRows"></div>
    </div>
    <button class="link-btn" id="logout"><i class="fas fa-right-from-bracket"></i> Log out</button>
  </div>
</div>
</body>
</html>
